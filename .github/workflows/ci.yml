name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TeamsMeetings.slnx

      - name: Check formatting
        run: dotnet format whitespace TeamsMeetings.slnx --verify-no-changes

      - name: Build
        run: dotnet build TeamsMeetings.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test TeamsMeetings.slnx --no-build --configuration Release
          --collect:"XPlat Code Coverage" --results-directory ./coverage
          --logger "trx;LogFilePrefix=results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage
